<div class="card h-100"><div class="card-header"><h3 class="h5 mb-0"><i class="ti ti-history me-2 text-info"></i>Audit history</h3></div><div class="card-body"><ul class="list-group list-group-flush">{% for event in resource.audit_events.all %}<li class="list-group-item px-0">{{ event.created_at }} — {{ event.get_event_type_display }} — {{ event.description }}</li>{% empty %}<li class="list-group-item px-0 text-muted">No audit events.</li>{% endfor %}</ul></div></div>
