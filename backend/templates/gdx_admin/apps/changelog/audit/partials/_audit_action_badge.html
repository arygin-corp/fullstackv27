<span class="badge {% if action == 'CREATE' %}bg-success-subtle text-success{% elif action == 'UPDATE' %}bg-primary-subtle text-primary{% elif action == 'DELETE' %}bg-danger-subtle text-danger{% else %}bg-secondary-subtle text-secondary{% endif %}">
  {% if action == 'CREATE' %}<i class="ti ti-plus me-1"></i>{% elif action == 'UPDATE' %}<i class="ti ti-edit me-1"></i>{% elif action == 'DELETE' %}<i class="ti ti-trash me-1"></i>{% else %}<i class="ti ti-activity me-1"></i>{% endif %}{{ label }}
</span>
