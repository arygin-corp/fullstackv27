<div class="card border-danger">
  <div class="card-body p-4 p-lg-5 text-center">
    <span class="avatar avatar-xxl bg-danger-subtle text-danger rounded-circle"><i class="ti ti-trash fs-1"></i></span>
    <h2 class="h4 mt-3">Delete {{ object.name }}?</h2>
    <p class="text-muted mx-auto mb-3">This permanently removes the category. Deletion is blocked when a release note uses this category.</p>
    <div class="alert alert-warning text-start"><i class="ti ti-alert-triangle me-2"></i>Review category usage before continuing. This operation cannot be undone after successful deletion.</div>
    <form method="post" class="d-flex flex-column flex-sm-row justify-content-center gap-2">{% csrf_token %}
      <a class="btn btn-light border" href="{% url 'changelog:category-detail' object.pk %}"><i class="ti ti-arrow-left me-1"></i>Cancel</a>
      <button class="btn btn-danger" type="submit"><i class="ti ti-trash me-1"></i>Delete category</button>
    </form>
  </div>
</div>
