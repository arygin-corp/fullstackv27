{% load static %}
<link rel="stylesheet" href="{% static 'gdx_admin/theme/css/catalog.css' %}?v=18.4">
<style>
.cc-nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
.cc-hello{margin:4px 0 28px;padding:0;background:transparent;border:0;box-shadow:none}
.cc-hello-top{display:flex;justify-content:space-between;gap:32px;align-items:flex-end}
.cc-welcome-line{margin:0;color:#64758b;font-size:16px;font-weight:400;line-height:1.4}
.cc-hello h1{margin:6px 0 0;color:#121826;font-size:2.35rem;font-weight:600;letter-spacing:-0.04em;line-height:1.05}
.cc-hello-meta{margin:10px 0 0;color:#3d4d63;font-size:.95rem;font-weight:400}
.cc-hello-side{padding-bottom:2px;text-align:right}
.cc-hello-date{margin:0;color:#121826;font-size:.95rem;font-weight:600;letter-spacing:-0.01em}
.cc-hello-time{margin:4px 0 0;color:#64758b;font-size:.84rem;font-weight:400}
.cc-hello-facts{display:flex;flex-wrap:wrap;gap:28px 48px;margin:28px 0 0;padding:0;list-style:none}
.cc-hello-facts li{min-width:88px}
.cc-hello-facts strong{display:block;color:#121826;font-size:1.65rem;font-weight:600;letter-spacing:-0.04em;line-height:1}
.cc-hello-facts span{display:block;margin-top:6px;color:#64758b;font-size:.75rem;font-weight:400}
.cc-nav a,.cc-create summary{padding:8px 12px;border-radius:999px;background:#f4f6f8;color:#3d4d63;font-weight:700;text-decoration:none;cursor:pointer;list-style:none}
.cc-nav a.is-current,.cc-create[open] summary{background:#efeaff;color:#5547ff}
.cc-nav a.cc-create{margin-left:auto;background:#5547ff;color:#fff}
.cc-catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cc-catalog section{max-height:260px;overflow:auto;padding:12px 14px;border:1px solid #e6ebf2;border-radius:14px;background:#fff}
.cc-catalog h2{margin:0 0 8px;font-size:.92rem}
.cc-catalog label{display:flex;gap:8px;align-items:flex-start;margin:0 0 6px;color:#1c2740;font-size:.84rem}
.cc-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px}
.cc-form label{display:grid;gap:4px;color:#64758b;font-size:.75rem;font-weight:700}
.cc-form input,.cc-form select,.cc-add select{width:100%;height:36px;padding:4px 8px;border:1px solid #d7deea;border-radius:8px;color:#1c2740}
.cc-form button,.cc-add button,.cc-widget button,form > p button{height:36px;padding:0 12px;border:0;border-radius:8px;background:#5547ff;color:#fff;font-weight:700}
.cc-widget input,.cc-widget select{width:100%;height:36px;margin:0 0 8px;padding:4px 8px;border:1px solid #d7deea;border-radius:8px}
.cc-widgets{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.4fr);gap:16px;align-items:start}
.cc-widget-wide{grid-column:1 / -1}
.cc-widget{min-width:0;overflow:hidden;padding:16px 18px;border:1px solid #e6ebf2;border-radius:14px;background:#fff}
.cc-widget header{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.cc-widget h3{margin:0;font-size:1rem;color:#1c2740}
.cc-widget .deploy-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0}
.cc-widget .deploy-metric{min-height:92px}
.cc-widget .deploy-metric strong{font-size:1.8rem;letter-spacing:-0.03em}
.cc-widget button{height:28px;background:#f4f6f8;color:#3d4d63}
.cc-add{display:flex;gap:8px;align-items:center;margin:0 0 12px}
.cc-map{position:relative;height:360px;overflow:hidden;border-radius:12px;background:#d5e3ef}
.cc-widget-wide .cc-map{height:480px}
.cc-map img{position:absolute;width:256px;height:256px;pointer-events:none}
.cc-map-pin{position:absolute;z-index:2;width:12px;height:12px;margin:-6px 0 0 -6px;padding:0;border:2px solid #fff;border-radius:50%;background:#5547ff;box-shadow:0 1px 4px rgba(28,39,64,.35)}
.cc-map .cc-map-bubble{border:0;border-radius:50%;background:rgba(26,115,232,.72);box-shadow:none}
.cc-live{position:relative;height:420px;margin:0 0 16px;overflow:hidden;border:1px solid #e6ebf2;border-radius:16px;background:#e7eef5}
.cc-live-map{position:absolute;inset:0;padding:0;border:0;border-radius:0;background:transparent}
.cc-live-map .cc-map{height:420px;border-radius:0}
.cc-live-card{position:absolute;z-index:4;top:16px;left:16px;width:min(340px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;padding:16px 18px 14px;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(28,39,64,.12)}
.cc-live-card p{margin:14px 0 6px;color:#5f6368;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.cc-live-card p:first-child{margin-top:0}
.cc-live-card strong{display:block;color:#1c2740;font-size:2.4rem;line-height:1;letter-spacing:-0.04em}
.cc-live-card small,.cc-rank-card small{display:block;margin-top:10px;color:#64758b;font-size:.75rem}
.cc-minutes{display:flex;align-items:flex-end;gap:3px;height:72px}
.cc-minutes i{flex:1;display:block;min-height:2px;border-radius:2px 2px 0 0;background:#1a73e8}
.cc-device{display:flex;gap:16px;align-items:center}
.cc-donut{display:grid;place-items:center;width:92px;height:92px;border-radius:50%}
.cc-donut span{width:52px;height:52px;border-radius:50%;background:#fff}
.cc-device ul{margin:0;padding:0;list-style:none}
.cc-device li{display:flex;gap:6px;align-items:center;margin:0 0 6px;color:#1c2740;font-size:.84rem}
.cc-device b{margin-left:auto}
.cc-swatch{width:8px;height:8px;border-radius:50%;background:#1a73e8}
.cc-swatch-2{background:#8ab4f8}
.cc-swatch-3{background:#d2e3fc}
.cc-live-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cc-rank-card{padding:16px 18px;border:1px solid #e6ebf2;border-radius:14px;background:#fff}
.cc-rank-card h2{margin:0 0 12px;color:#1c2740;font-size:1rem}
.cc-rank{margin:0 0 12px}
.cc-rank-title{display:flex;justify-content:space-between;gap:8px;color:#1c2740;font-weight:700}
.cc-rank-share{margin:2px 0 4px;color:#64758b;font-size:.78rem}
.cc-rank-bar{height:6px;overflow:hidden;border-radius:99px;background:#e8eef6}
.cc-rank-bar i{display:block;height:100%;border-radius:99px;background:#1a73e8}
.cc-map-zoom{position:absolute;top:8px;right:8px;z-index:3;display:grid;gap:4px}
.cc-map-zoom button{width:28px;height:28px;padding:0;border:0;border-radius:6px;background:#fff;color:#1c2740;font-weight:700}
.cc-map-credit{position:absolute;right:8px;bottom:8px;z-index:3;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.85);color:#3d4d63;font-size:.68rem}
.cc-board{margin:28px 0 0}
.cc-board h2{margin:0 0 12px;color:#121826;font-size:1.2rem;font-weight:600;letter-spacing:-0.03em}
.cc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:0 0 12px;padding:0;list-style:none}
.cc-stats li{padding:12px 14px;border:1px solid #e6ebf2;border-radius:14px;background:#fff}
.cc-stats strong{display:block;color:#121826;font-size:1.35rem;font-weight:600;letter-spacing:-0.03em;line-height:1.1}
.cc-stats span{display:block;margin-top:6px;color:#64758b;font-size:.75rem;line-height:1.3}
.cc-chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.cc-chart-card{min-width:0;padding:12px 14px 4px;border:1px solid #e6ebf2;border-radius:16px;background:#fff}
.cc-chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cc-chart-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px;margin:0}
.cc-chart-tools select,.cc-chart-tools button{box-sizing:border-box;height:28px;min-height:28px;max-height:28px;border:1px solid #e6ebf2;border-radius:8px;background:#fff;color:#3d4d63;font:400 12px/28px inherit;padding:0 8px}
.cc-chart-tools button{display:inline-flex;align-items:center;justify-content:center;width:28px;min-width:28px;padding:0;cursor:pointer}
.cc-chart-tools button .isax{font-size:16px;line-height:1}
.cc-chart-wide{grid-column:1 / -1}
.cc-chart{min-height:0}
.cc-board h3{margin:0 0 4px;color:#1c2740;font-size:.95rem;font-weight:600}
.cc-board .cc-note{margin:8px 0 12px;color:#64758b;font-size:.75rem}
@media (max-width:991.98px){.cc-catalog,.cc-form,.cc-widgets,.cc-live-columns,.cc-chart-grid{grid-template-columns:1fr}.cc-chart-wide{grid-column:auto}.cc-hello-top{flex-direction:column;align-items:flex-start}.cc-hello-side{text-align:left}.cc-hello h1{font-size:1.85rem}.cc-live{height:auto;min-height:420px}.cc-live-card{position:relative;top:auto;left:auto;width:auto;margin:12px}}
.cc-error{margin:0 0 12px;color:#b42318;font-weight:700}
.cc-series{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:12px}
.cc-series span{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.cc-series i{display:block;border-radius:6px 6px 0 0;background:#5547ff}
.cc-series small{margin-top:4px;color:#64758b;font-size:.65rem;text-align:center}
.cc-ok{color:#167940;font-weight:700}
.cc-warn{color:#b54708;font-weight:700}
.cc-down{color:#b42318;font-weight:700}
</style>
{% if not hide_tabs %}
<nav class="cc-nav" aria-label="Command Center">
    <a href="{% url 'command_center:dashboard' %}" class="{% if section == 'dashboard' %}is-current{% endif %}">Dashboard</a>
    <a href="{% url 'command_center:analytics' %}" class="{% if section == 'analytics' %}is-current{% endif %}">Analytics</a>
    <a href="{% url 'command_center:health' %}" class="{% if section == 'health' %}is-current{% endif %}">Health</a>
    <a href="{% url 'command_center:workflow' %}" class="{% if section == 'workflow' %}is-current{% endif %}">Workflow</a>
    <a href="{% url 'deployment:dashboard' %}">Deployment</a>
</nav>
{% endif %}
{% if error %}<p class="cc-error">{{ error }}</p>{% endif %}
