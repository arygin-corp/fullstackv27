<nav class="module-context-header" aria-label="Module pages">
  <div class="module-context-header__copy">
    <div class="module-context-breadcrumb">
      <a href="{% url 'third_party_api_pages:integration_catalog' %}">Integrations</a>
      <span aria-hidden="true">»</span>
      <span>{{ module.name }}</span>
      <span aria-hidden="true">»</span>
      <span aria-current="page">{{ page_label }}</span>
    </div>
    <h1>{{ page_heading }}</h1>
    <p>{{ page_subheading }}</p>
  </div>
  <div class="module-context-header__actions module-context-header__menu">
    {% for page in pages %}
      <a href="{{ page.url }}"{% if page.key == page_key %} aria-current="page"{% endif %}>{{ page.label }}</a>
    {% endfor %}
  </div>
</nav>
