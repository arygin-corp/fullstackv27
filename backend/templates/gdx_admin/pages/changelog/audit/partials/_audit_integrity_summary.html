<div class="card h-100">
  <div class="card-header"><h3 class="h5 mb-0"><i class="ti ti-shield-check me-2 text-success"></i>Integrity summary</h3></div>
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between gap-3 py-3 border-bottom"><span class="text-muted">Event ID</span><code class="text-break text-end">{{ audit_log.pk }}</code></div>
    <div class="d-flex align-items-center justify-content-between gap-3 py-3 border-bottom"><span class="text-muted">Changed fields</span><span class="badge bg-info-subtle text-info flex-shrink-0">{{ field_changes|length }}</span></div>
    <div class="d-flex align-items-center justify-content-between gap-3 py-3"><span class="text-muted">Snapshot</span><span class="badge flex-shrink-0 {% if audit_log.snapshot %}bg-success-subtle text-success{% else %}bg-secondary-subtle text-secondary{% endif %}">{% if audit_log.snapshot %}Available{% else %}Unavailable{% endif %}</span></div>
  </div>
</div>
