{% if is_paginated %}<nav aria-label="Audit pages" class="mt-4"><ul class="pagination justify-content-center mb-0">
  {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{% if filter_query %}{{ filter_query }}&{% endif %}page={{ page_obj.previous_page_number }}"><i class="ti ti-chevron-left me-1"></i>Previous</a></li>{% else %}<li class="page-item disabled"><span class="page-link"><i class="ti ti-chevron-left me-1"></i>Previous</span></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span></li>
  {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{% if filter_query %}{{ filter_query }}&{% endif %}page={{ page_obj.next_page_number }}">Next<i class="ti ti-chevron-right ms-1"></i></a></li>{% else %}<li class="page-item disabled"><span class="page-link">Next<i class="ti ti-chevron-right ms-1"></i></span></li>{% endif %}
</ul></nav>{% endif %}
