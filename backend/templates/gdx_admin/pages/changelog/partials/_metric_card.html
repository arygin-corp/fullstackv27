<div class="col-sm-6 col-xl-3">
  <div class="card h-100">
    <div class="card-body">
      <div class="d-flex align-items-start justify-content-between gap-3">
        <div>
          <span class="text-muted d-block">{{ label }}</span>
          <h3 class="display-6 mb-1 mt-2">{{ value|default:"0" }}</h3>
          <small class="{{ help_class|default:'text-muted' }}">{{ help_text }}</small>
        </div>
        <span class="avatar rounded-circle {{ icon_class|default:'bg-primary-subtle text-primary' }} flex-shrink-0">
          <i class="{{ icon }} fs-4"></i>
        </span>
      </div>
    </div>
  </div>
</div>
