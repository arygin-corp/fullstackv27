<section class="card mb-4" aria-labelledby="health-center-title"><div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2"><div><h3 class="h5 mb-1" id="health-center-title">Application health center</h3><p class="small text-muted mb-0">Current component checks supplied by the backend.</p></div><span class="badge {% if dashboard_health_score >= 95 %}bg-success-transparent text-success{% elif dashboard_health_score >= 80 %}bg-warning-transparent text-warning{% else %}bg-danger-transparent text-danger{% endif %}">{{ dashboard_health_score|default:100 }}% healthy</span></div><div class="card-body"><div class="health-grid">{% for check in health_checks %}<article class="health-tile"><span class="health-icon {% if check.level == 'success' %}bg-success-transparent text-success{% elif check.level == 'warning' %}bg-warning-transparent text-warning{% else %}bg-danger-transparent text-danger{% endif %}"><i class="ti {% if check.level == 'success' %}ti-circle-check{% elif check.level == 'warning' %}ti-alert-circle{% else %}ti-alert-octagon{% endif %}"></i></span><div><strong class="d-block">{{ check.label }}</strong><span class="small text-muted">{{ check.status }}</span></div></article>{% empty %}<p class="text-muted mb-0">No health checks were supplied.</p>{% endfor %}</div></div></section>
