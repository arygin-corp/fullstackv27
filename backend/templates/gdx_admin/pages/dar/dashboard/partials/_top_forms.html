<section class="card mb-4"><div class="card-header d-flex justify-content-between align-items-center"><div><h3 class="h6 mb-1">Most used forms</h3><p class="small text-muted mb-0">Highest request volume by form.</p></div><span class="badge bg-primary-transparent text-primary">Top 10</span></div><div class="card-body"><div class="ranked-list">{% for form in top_forms %}<div class="ranked-item"><span class="rank">{{ forloop.counter }}</span><div class="flex-grow-1"><strong>{{ form.name }}</strong><div class="progress mt-2" style="height:6px"><div class="progress-bar" style="width:{% widthratio form.submission_count top_form_max 100 %}%"></div></div></div><span class="badge bg-light text-dark">{{ form.submission_count }}</span></div>{% empty %}<p class="text-muted mb-0">No form activity found.</p>{% endfor %}</div></div></section>
