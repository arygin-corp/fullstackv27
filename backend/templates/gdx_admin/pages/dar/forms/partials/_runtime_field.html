<div class="border rounded-3 p-3 mb-3" data-field-key="{{ field.name }}">
  <div class="mb-2">{{ field.label_tag }}</div>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="text-danger small mt-1"><i class="ti ti-alert-circle me-1"></i>{{ error }}</div>{% endfor %}
</div>
