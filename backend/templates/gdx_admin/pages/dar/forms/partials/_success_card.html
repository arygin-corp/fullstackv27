<div class="card border-success"><div class="card-body p-4 p-lg-5 text-center">
  <span class="avatar avatar-xxl bg-success-subtle text-success rounded-circle"><i class="ti ti-circle-check fs-1"></i></span>
  <h1 class="h2 mt-3">{{ definition.success_title|default:"Submission received" }}</h1>
  {% if definition.success_message %}<p class="text-muted mx-auto">{{ definition.success_message }}</p>{% endif %}
  <div class="d-inline-flex align-items-center gap-2 bg-light border rounded-3 px-3 py-2 mt-2"><span class="text-muted">Reference</span><code class="fw-semibold">{{ submission.pk }}</code></div>
</div></div>
