<div class="card h-100"><div class="card-header"><div><h3 class="h5 mb-1"><i class="ti ti-test-pipe me-2 text-primary"></i>Simulation inputs</h3><p class="text-muted mb-0">Submit values to test routing without creating a submission.</p></div></div><div class="card-body"><form method="post" novalidate>{% csrf_token %}{{ form.non_field_errors }}<div class="vstack gap-3">{% for field in form %}<div class="border rounded-3 p-3"><label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}</div>{% endfor %}</div><button class="btn btn-primary mt-4" type="submit"><i class="ti ti-route me-1"></i>Resolve route</button></form></div></div>
