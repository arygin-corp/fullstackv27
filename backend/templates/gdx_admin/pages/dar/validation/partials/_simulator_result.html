<div class="card"><div class="card-header"><div><h3 class="h5 mb-1"><i class="ti ti-report me-2 text-info"></i>Validation result</h3><p class="text-muted mb-0">Result returned by the validation simulator.</p></div></div><div class="card-body">{% if errors %}<div class="alert alert-danger"><i class="ti ti-circle-x me-2"></i>Validation errors found.</div><pre class="bg-light border rounded-3 p-3 mb-0 overflow-auto text-wrap">{{ errors|pprint }}</pre>{% elif tested %}<div class="alert alert-success mb-0"><i class="ti ti-circle-check me-2"></i>Payload is valid.</div>{% else %}<div class="text-center py-5"><span class="avatar avatar-xl bg-info-subtle text-info rounded-circle"><i class="ti ti-shield-question fs-2"></i></span><h4 class="h6 mt-3 mb-1">No validation result yet</h4><p class="text-muted small mb-0">Submit values to test validation.</p></div>{% endif %}</div></div>
