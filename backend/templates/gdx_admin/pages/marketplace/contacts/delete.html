{% extends 'gdx_admin/base.html' %}
{% load static %}
{% block title %}Delete Contact{% endblock %}
{% block content %}

<div class="card border-danger"><div class="card-body"><p>Delete <strong>{{ contact.name|default:contact }}</strong>?</p><form method="post">{% csrf_token %}<button class="btn btn-danger">Delete</button> <a class="btn btn-light" href="{% url 'marketplace_admin:contact_detail' contact.pk %}">Cancel</a></form></div></div>
{% endblock %}
