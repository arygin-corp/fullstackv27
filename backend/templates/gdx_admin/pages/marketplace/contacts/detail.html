{% extends 'gdx_admin/base.html' %}
{% load static %}
{% block title %}Contact{% endblock %}
{% block content %}

<div class="d-flex justify-content-between mb-4"><a class="btn btn-outline-primary" href="{% url 'marketplace_admin:contact_update' contact.pk %}">Edit</a></div><div class="card"><div class="card-body"><dl class="row"><dt class="col-sm-3">Name</dt><dd class="col-sm-9">{{ contact.name|default:contact }}</dd><dt class="col-sm-3">Description</dt><dd class="col-sm-9">{{ contact.description|default:'-' }}</dd></dl></div></div>
{% endblock %}
