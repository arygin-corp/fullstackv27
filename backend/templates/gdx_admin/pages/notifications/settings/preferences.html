{% extends "gdx_admin/base.html" %}
{% block title %}Notification preferences{% endblock %}
{% block extra_css %}
<style>
.preference-layout.row { align-items: stretch; flex-wrap: nowrap; gap: 16px; }
.preference-layout.row > .col-lg-9 { flex: 0 0 calc(75% - 12px); width: calc(75% - 12px); max-width: calc(75% - 12px); }
.preference-layout.row > .col-lg-3 { flex: 0 0 calc(25% - 4px); width: calc(25% - 4px); max-width: calc(25% - 4px); }
.preference-layout .card-body .row { gap: 12px; }
.preference-layout .card-body .row > .col-md-6 { flex: 0 0 calc(50% - 6px); width: calc(50% - 6px); max-width: calc(50% - 6px); }
@media (max-width: 991.98px) {
    .preference-layout.row { flex-wrap: wrap; }
    .preference-layout.row > .col-lg-9,
    .preference-layout.row > .col-lg-3 { flex-basis: 100%; width: 100%; max-width: 100%; }
}
</style>
{% endblock %}
{% block content %}
{% include "gdx_admin/pages/notifications/settings/partials/_preferences_content.html" %}
{% endblock %}
