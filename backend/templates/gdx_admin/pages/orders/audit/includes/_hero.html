<section class="health-hero card bg-primary-gradient-200 border-0 overflow-hidden mb-4">
    <div class="card-body p-4 p-lg-5">
        <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-4">
            <div class="d-flex gap-3">
                <span class="avatar avatar-xl rounded-circle bg-white bg-opacity-10 text-white">
                    <i class="ti ti-heart-rate-monitor fs-2"></i>
                </span>
                <div>
                    <span class="badge bg-white bg-opacity-10 text-white mb-2">ORDER AUDIT & COMPLIANCE</span>
                    <h1 class="text-white mb-2">Orders Audit Ledger</h1>
                    <p class="text-white opacity-75 mb-0">Review synchronization activity, reconciliation events, ServiceNow integrations, workflow changes, failures,
                        quarantined transactions, and operational audit history.</p>
                </div>
            </div>
            <div class="health-score-card">
                <span class="small text-white opacity-75">Overall task health</span>
                <strong class="display-6 text-white d-block">{{ health_metrics.health_score|default:100 }}%</strong>
            </div>
        </div>
    </div>
</section>
