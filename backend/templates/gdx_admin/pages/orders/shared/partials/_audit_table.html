<div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Time</th><th>Event</th><th>Status</th><th>Message</th></tr></thead><tbody>{% for audit in audits %}<tr><td>{{ audit.created_at|date:'M d, Y H:i'|default:'-' }}</td><td>{{ audit.event|default:audit.action|default:'-' }}</td><td>{{ audit.status|default:'Unknown' }}</td><td>{{ audit.message|default:audit.detail|default:'-' }}</td></tr>{% empty %}<tr><td colspan="4" class="text-center text-muted py-5">No recent failures.</td></tr>{% endfor %}</tbody></table></div>
