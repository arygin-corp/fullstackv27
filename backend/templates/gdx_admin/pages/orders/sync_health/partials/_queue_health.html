<section class="card h-100"><div class="card-header"><h3 class="h6 mb-0">Queue health</h3></div><div class="card-body"><div class="d-flex justify-content-between border-bottom pb-3 mb-3"><span>Total requests</span><strong>{{ health_metrics.requests|default:0 }}</strong></div><div class="d-flex justify-content-between border-bottom pb-3 mb-3"><span>Total tasks</span><strong>{{ health_metrics.tasks|default:0 }}</strong></div><div class="d-flex justify-content-between"><span>Failed tasks</span><strong class="text-danger">{{ health_metrics.failed_tasks|default:0 }}</strong></div></div></section>
