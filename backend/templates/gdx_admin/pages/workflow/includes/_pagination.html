{% if is_paginated %}<nav><ul class="pagination justify-content-end mb-0"><li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}"><a class="page-link" {% if page_obj.has_previous %}href="?page={{ page_obj.previous_page_number }}"{% endif %}>Previous</a></li><li class="page-item active"><span class="page-link">{{ page_obj.number }}</span></li><li class="page-item {% if not page_obj.has_next %}disabled{% endif %}"><a class="page-link" {% if page_obj.has_next %}href="?page={{ page_obj.next_page_number }}"{% endif %}>Next</a></li></ul></nav>{% endif %}
