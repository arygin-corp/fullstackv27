<tr><td><div class="fw-semibold">{{ workflow.name }}</div><div class="small text-muted">{{ workflow.description|truncatechars:75 }}</div></td><td><span class="badge wf-status wf-status-{{ workflow.status|lower }}">{{ workflow.get_status_display|default:workflow.status }}</span></td><td>{{ workflow.version|default:"1" }}</td><td>{{ workflow.updated_at|date:"M j, Y g:i A" }}</td><td class="text-end"><div class="btn-group"><a class="btn btn-sm btn-outline-primary" href="{% url 'workflow:detail' workflow.pk %}">Open</a><a class="btn btn-sm btn-outline-secondary" href="{% url 'workflow:builder' workflow.pk %}">Edit</a><button class="btn btn-sm btn-outline-success" data-wf-run="{{ workflow.pk }}">Run</button></div></td></tr>
