<!-- =============================================================
     ACTIVE SIDEBAR SYNCHRONIZATION
     ============================================================= -->
<script>
(function () {
	"use strict";

	function normalizedPath(value) {
		try {
			var path = new URL(value, window.location.origin).pathname.replace(/\/+$/, "");
			return path || "/";
		} catch (error) {
			return "";
		}
	}

	function expandActiveBranch(link) {
		link.classList.add("active");
		link.setAttribute("aria-current", "page");
		var item = link.closest("li");
		while (item) {
			var list = item.parentElement;
			if (!list || !list.closest("#sidebar-menu")) {
				break;
			}
			list.style.display = "block";
			var parent = list.closest("li.submenu");
			if (!parent) {
				break;
			}
			parent.classList.add("active");
			var toggle = parent.querySelector(":scope > a");
			if(toggle) {
				toggle.classList.add("subdrop");
				toggle.setAttribute("aria-expanded", "true");
			}
			item = parent;
		}
	}

	function syncSidebarState() {
		var sidebar = document.getElementById("sidebar-menu");
		if (!sidebar) {
			return;
		}
		var current = normalizedPath(window.location.href);
		var links = Array.from(sidebar.querySelectorAll('a:not([href="#"]):not([href=""])'));
		var matches = links.filter(function (link) {
			return (normalizedPath(link.href) === current);
		});
		if (!matches.length) {
			matches = links.filter(function (link) {
				var candidate = normalizedPath(link.href);
				return (candidate !== "/" && current.indexOf(candidate + "/") === 0);
			}).sort(function (left, right) {
				return (normalizedPath(right.href).length - normalizedPath(left.href).length);
			}).slice(0, 1);
		}
		matches.forEach(expandActiveBranch);
	}
	if (document.readyState === "loading") {
		document.addEventListener("DOMContentLoaded", syncSidebarState);
	} else {
		syncSidebarState();
	}
})();
</script>
