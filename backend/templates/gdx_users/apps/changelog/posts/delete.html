{% extends "gdx_users/partials/base.html" %}

{% block extra_css %}
    {% include "gdx_users/apps/marketplace/partials/record_view_style.html" %}
{% endblock %}

{% block contents %}
<div class="record-view">
    <div class="card record-delete">
        <div class="card-body">
            <div class="record-kicker">Delete release</div>
            <h3 class="mb-2">{{ object.version }}</h3>
            <p class="record-copy">{{ object.title }}</p>
            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Delete</button>
                <a class="btn btn-light" href="{% url 'changelog_staff:post-detail' object.pk %}">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
