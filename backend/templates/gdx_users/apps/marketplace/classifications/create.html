{% extends 'partials/base.html' %}

{% block contents %}
<div class="row">
    <div class="col-lg-8">
        <form method="post">
            {% csrf_token %}

            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">Classification Details</h4>
                </div>
                <div class="card-body">
                    {{ form.as_p }}
                </div>
            </div>

            <button class="btn btn-primary mt-4">Submit</button>
            <a href="{% url 'marketplace:classification-index' %}" class="btn btn-light mt-4">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
