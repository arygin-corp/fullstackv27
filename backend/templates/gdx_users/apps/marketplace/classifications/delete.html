{% extends 'partials/base.html' %}

{% block contents %}
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title text-danger">Delete Classification: {{ object.name }}</h4>
                <p>Are you sure you want to delete the classification "<strong>{{ object.name }}</strong>"?</p>
                <p class="text-muted">This action cannot be undone.</p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Confirm Delete</button>
                    <a href="{% url 'marketplace:classification-detail' object.pk %}" class="btn btn-light">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
