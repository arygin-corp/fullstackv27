{% extends 'gdx_users/partials/base.html' %}
{% load static %}

{% block extra_css %}
<style>
    .review-stat {
        border: 1px solid #d9dee8;
        background: #fff;
        border-radius: 12px;
        text-align: left;
        box-shadow: 0 1px 2px rgba(18, 24, 38, 0.04);
        transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .review-stat:hover { transform: translateY(-1px); }
    .review-stat .card-body {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
    }
    .review-stat-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 44px;
        font-size: 22px;
    }
    .review-stat-copy { min-width: 0; }
    .review-stat-copy span { display: block; color: #64758b; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .review-stat-copy strong { color: #121826; font-size: 28px; font-weight: 600; line-height: 1; }
    .review-stat.is-total .review-stat-icon { background: #efeaff; color: #583fc9; }
    .review-stat.is-pending .review-stat-icon { background: #e7f8fb; color: #06aed4; }
    .review-stat.is-approved .review-stat-icon { background: #e8f8ef; color: #27ae60; }
    .review-stat.is-rejected .review-stat-icon { background: #fdecec; color: #ef1e1e; }
    .review-stat.is-total.is-selected { border-color: #583fc9; box-shadow: 0 8px 18px rgba(88, 63, 201, 0.12); }
    .review-stat.is-pending.is-selected { border-color: #06aed4; box-shadow: 0 8px 18px rgba(6, 174, 212, 0.14); }
    .review-stat.is-approved.is-selected { border-color: #27ae60; box-shadow: 0 8px 18px rgba(39, 174, 96, 0.14); }
    .review-stat.is-rejected.is-selected { border-color: #ef1e1e; box-shadow: 0 8px 18px rgba(239, 30, 30, 0.12); }
</style>
{% endblock %}

{% block extra_javascript %}
    <script src="{% static 'gdx_theme/libs/datatables.net/js/jquery.dataTables.min.js' %}"></script>
    <script src="{% static 'gdx_theme/libs/datatables.net-bs4/js/dataTables.bootstrap4.min.js' %}"></script>
    <script src="{% static 'gdx_theme/libs/datatables.net-responsive/js/dataTables.responsive.min.js' %}"></script>
    <script src="{% static 'gdx_theme/libs/datatables.net-responsive-bs4/js/responsive.bootstrap4.min.js' %}"></script>
    <script>
        $(document).ready(function() {
            var reviewsTable = $('#reviews-list').DataTable({
                "processing": true,
                "serverSide": true,
                "ajax": {
                    "url": "{% url 'marketplace:review-index' %}",
                    "type": "GET",
                    "data": function (d) {
                        d.q = $('#searchTableList').val();
                        d.status = $('#idStatus').val();
                    }
                },
                "columns": [
                    { "data": "id", "className": "text-center" },
                    { "data": "title" },
                    { "data": "rating", "className": "text-center" },
                    { "data": "recommend", "className": "text-center" },
                    { "data": "expectations", "className": "text-center" },
                    { "data": "status", "className": "text-center" },
                    { "data": "created" },
                    { "data": "actions", "orderable": false, "searchable": false, "className": "text-center" }
                ],
                "pageLength": {{ current_per_page }},
                "lengthChange": false,
                "searching": false,
                "info": true,
                "paging": true,
                "responsive": true
            });

            function markStatus(status) {
                $('.review-stat').removeClass('is-selected');
                $('.review-stat[data-status="' + status + '"]').addClass('is-selected');
            }

            $('#searchTableList').on('input', function() {
                reviewsTable.ajax.reload();
            });
            $('#idStatus').on('change', function() {
                markStatus($(this).val());
                reviewsTable.ajax.reload();
            });
            $('#idPerPage').on('change', function() {
                reviewsTable.page.len($(this).val()).draw();
            });
            $('.review-stat').on('click', function() {
                $('#idStatus').val($(this).data('status')).trigger('change');
            });
            markStatus('all');
        });
    </script>
{% endblock %}

{% block contents %}
<div class="row g-3 mb-3">
    <div class="col-md-6 col-xl-3">
        <button type="button" class="card review-stat is-total is-selected w-100" data-status="all">
            <div class="card-body">
                <span class="review-stat-icon"><i class="bx bx-layer"></i></span>
                <span class="review-stat-copy"><span>Total</span><strong>{{ review_counts.total }}</strong></span>
            </div>
        </button>
    </div>
    <div class="col-md-6 col-xl-3">
        <button type="button" class="card review-stat is-pending w-100" data-status="pending">
            <div class="card-body">
                <span class="review-stat-icon"><i class="bx bx-time-five"></i></span>
                <span class="review-stat-copy"><span>Pending approval</span><strong>{{ review_counts.pending }}</strong></span>
            </div>
        </button>
    </div>
    <div class="col-md-6 col-xl-3">
        <button type="button" class="card review-stat is-approved w-100" data-status="approved">
            <div class="card-body">
                <span class="review-stat-icon"><i class="bx bx-check-circle"></i></span>
                <span class="review-stat-copy"><span>Approved</span><strong>{{ review_counts.approved }}</strong></span>
            </div>
        </button>
    </div>
    <div class="col-md-6 col-xl-3">
        <button type="button" class="card review-stat is-rejected w-100" data-status="rejected">
            <div class="card-body">
                <span class="review-stat-icon"><i class="bx bx-x-circle"></i></span>
                <span class="review-stat-copy"><span>Rejected</span><strong>{{ review_counts.rejected }}</strong></span>
            </div>
        </button>
    </div>
</div>
<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-body border-bottom">
                <div class="d-flex align-items-center">
                    <h5 class="mb-0 card-title flex-grow-1">{{ total_reviews_count }} Reviews</h5>
                    <div class="flex-shrink-0">
                        <a href="javascript:void(0);" class="btn btn-light" onclick="$('#reviews-list').DataTable().ajax.reload();"><i class="mdi mdi-refresh"></i></a>
                    </div>
                </div>
            </div>
            <div class="card-body border-bottom">
                <div class="row g-3">
                    <div class="col-xxl-6 col-lg-6">
                        <input type="search" class="form-control" id="searchTableList" placeholder="Search for ..." value="">
                    </div>
                    <div class="col-xxl-3 col-lg-3">
                        <select class="form-select" id="idStatus" aria-label="Review status">
                            <option value="all" selected>Select Status</option>
                            <option value="pending">Pending Approval</option>
                            <option value="approved">Approved</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                    <div class="col-xxl-1 col-lg-1">
                        <select class="form-select" id="idPerPage" aria-label="Reviews per page">
                            <option value="25" {% if current_per_page == 25 %}selected{% endif %}>25</option>
                            <option value="50" {% if current_per_page == 50 %}selected{% endif %}>50</option>
                            <option value="100" {% if current_per_page == 100 %}selected{% endif %}>100</option>
                            <option value="150" {% if current_per_page == 150 %}selected{% endif %}>150</option>
                            <option value="200" {% if current_per_page == 200 %}selected{% endif %}>200</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table align-middle dt-responsive nowrap w-100 table-check" id="reviews-list">
                        <thead>
                            <tr>
                                <th scope="col" class="text-center">ID</th>
                                <th scope="col">Title</th>
                                <th scope="col" class="text-center">Rating</th>
                                <th scope="col" class="text-center">Recommend</th>
                                <th scope="col" class="text-center">Expectations</th>
                                <th scope="col" class="text-center">Status</th>
                                <th scope="col">Created</th>
                                <th scope="col" class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
