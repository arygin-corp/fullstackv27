<div class="account-menu">
    <div class="account-menu__divider"></div>
    <a routerLink="/marketplace/user/dashboard" class="account-menu__user" (click)="closeMenu.emit()" style="text-decoration: none;">
        <div class="account-menu__user-avatar">
            <img *ngIf="photo; else noImageFound" [src]="photo" alt="">
            <ng-template #noImageFound>
                <ngx-avatar size="64" bgColor="#222" fgColor="#04fdff" name="{{profile?.givenName}} {{profile?.surname}}"></ngx-avatar>
            </ng-template>
            <span class="account-menu__status-dot account-menu__status-dot--avatar" [attr.data-status]="profileStatus.current$ | async" aria-hidden="true"></span>
        </div>

        <div class="account-menu__user-info" style="margin-left: 20px;">
            <div class="account-menu__user-name">{{profile?.givenName}} {{profile?.surname}}</div>
            <div class="account-menu__user-job-title" *ngIf="jobTitleLabel"><small style="font-size: 12px;">{{ jobTitleLabel }}</small></div>
            <div class="account-menu__user-email"><small>{{profile?.mail}}</small></div>
        </div>
    </a>
    <div class="account-menu__divider"></div>
    <div class="account-menu__status" *ngIf="profileStatus.current$ | async as status">
        <button type="button" class="account-menu__status-toggle" (click)="toggleStatus($event)" [attr.aria-expanded]="statusOpen" aria-haspopup="listbox">
            <span class="account-menu__status-dot" [attr.data-status]="status" aria-hidden="true"></span>
            <span>{{ profileStatus.labelFor(status) }}</span>
            <i class="ri-arrow-down-s-line" [class.is-open]="statusOpen" aria-hidden="true"></i>
        </button>
        <ul class="account-menu__status-panel" *ngIf="statusOpen" role="listbox" aria-label="Set your status">
            <li *ngFor="let option of profileStatus.options">
                <button type="button" class="account-menu__status-option" role="option" [attr.aria-selected]="option.id === status" [class.is-current]="option.id === status" (click)="setStatus(option.id, $event)">
                    <span class="account-menu__status-dot" [attr.data-status]="option.id" aria-hidden="true"></span>
                    {{ option.label }}
                </button>
            </li>
        </ul>
    </div>
    <div class="account-menu__divider"></div>
    <ul class="account-menu__links">
        <li><a routerLink="/marketplace/user/profile" (click)="closeMenu.emit()">My Profile</a></li>
        <li><a routerLink="/marketplace/user/dashboard" (click)="closeMenu.emit()">My Dashboard</a></li>
        <li><a routerLink="/marketplace/user/orders" (click)="closeMenu.emit()">Order History</a></li>
        <!--<li><a routerLink="/marketplace/user/addresses" (click)="closeMenu.emit()">Addresses</a></li>
        <li><a routerLink="/marketplace/user/password" (click)="closeMenu.emit()">Password</a></li>-->
    </ul>
    <div class="account-menu__divider"></div>
    <ul class="account-menu__links">
        <li>
            <a class="account-menu__logout" (click)="logout()">
                <i class="ri-lock-unlock-line" aria-hidden="true"></i>
                Log Out
            </a>
        </li>
    </ul>
    <ng-container *ngIf="lastSignInLabel">
        <div class="account-menu__divider"></div>
        <p class="account-menu__signin">
            Hi, {{ profile?.givenName }}! Your last sign in was on
            <strong>{{ lastSignInLabel }}</strong>
        </p>
    </ng-container>
</div>
