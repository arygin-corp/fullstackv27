<div class="jumbotron jumbotron-fluid">
    <div class="container">
        <h1 class="display-4 text-center">FAQ</h1>
        <p class="lead text-center">Answers to the questions people ask while searching, requesting access, and using their Data Marketplace account.</p>
    </div>
</div>

<div class="container-fluid faq-page">
    <section class="faq-section" *ngFor="let section of sections">
        <h2>{{ section.title }}</h2>
        <div *ngFor="let item of section.items">
            <button type="button" class="accordion" [class.active]="item.open" (click)="toggle(item)">
                {{ item.question }}
            </button>
            <div class="panel" [class.panel--open]="item.open">
                <p *ngFor="let paragraph of item.answer">{{ paragraph }}</p>
            </div>
        </div>
    </section>
</div>
