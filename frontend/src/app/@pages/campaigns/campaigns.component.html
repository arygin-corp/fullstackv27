<!-- ✅ SLIDESHOW -->
<app-block-slideshow [slides]="slides"></app-block-slideshow>

<!-- ✅ 🔥 POPULAR DOMAINS -->
<app-block-domains
  header="📊 Featured Data Categories"
  layout="classic"
  [domains]="(popularDomains$ | async) || []">
</app-block-domains>

<!-- ✅ 📊 MOST REQUESTED (MOVED UP FOR CONVERSIONS) -->
<app-block-products
  header="📊 Most Requested"
  layout="large-first"
  [products]="(bestsellers$ | async) || []">
</app-block-products>

<!-- ✅ ✨ NEW ARRIVALS -->
<app-block-products-carousel
  header="✨ New Arrivals"
  layout="horizontal"
  [rows]="2"
  [loading]="latestProducts.loading"
  [products]="latestProducts.products"
  [groups]="latestProducts.groups"
  (groupChange)="groupChange(latestProducts, $event)">
</app-block-products-carousel>

<!-- ✅ ⭐ FEATURED PRODUCTS -->
<app-block-products-carousel
  header="⭐ Featured Products"
  layout="grid-4"
  [loading]="featuredProducts.loading"
  [products]="featuredProducts.products"
  [groups]="featuredProducts.groups"
  (groupChange)="groupChange(featuredProducts, $event)">
</app-block-products-carousel>

<!-- ✅ PRODUCT COLUMNS -->
<app-block-product-columns>
  <app-block-product-columns-item
    header="⭐ Top Rated Products"
    [products]="(columnTopRated$ | async) || []">
  </app-block-product-columns-item>

  <app-block-product-columns-item
    header="💰 Special Offers"
    [products]="(columnSpecialOffers$ | async) || []">
  </app-block-product-columns-item>

  <app-block-product-columns-item
    header="🔥 Bestsellers"
    [products]="(columnBestsellers$ | async) || []">
  </app-block-product-columns-item>
</app-block-product-columns>
