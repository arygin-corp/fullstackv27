<!-- page-post-details.component.html -->
<div class="post-detail-page">
  <!-- Hero Section with Cover Image -->
  <div class="hero-section" *ngIf="post">
    <div class="hero-image-wrapper">
      <img [src]="post.image" [alt]="post.title" class="hero-image">
      <div class="hero-overlay"></div>
    </div>
    
    <div class="hero-content container-fluid">
      <a routerLink="/newsroom" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Newsroom
      </a>
      
      <div class="category-badge">{{ post.category | titlecase }}</div>
      <h1 class="post-title">{{ post.title }}</h1>
      
      <div class="author-bar">
        <img [src]="post.authorImage" [alt]="post.author" class="author-avatar">
        <div class="author-info">
          <span class="author-name">{{ post.author }}</span>
          <span class="post-date">{{ post.date }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content-section container-fluid" *ngIf="post">
    <div class="content-wrapper">
      <p class="summary">{{ post.summary }}</p>
      
      <div class="post-body" [innerHTML]="post.content"></div>
      
      <div class="post-footer">
        <div class="tags">
          <span class="tag">{{ post.category }}</span>
        </div>
        
        <a routerLink="/newsroom" class="back-to-top">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back to Newsroom
        </a>
      </div>
    </div>
  </div>

  <!-- Not Found State -->
  <div class="not-found container-fluid" *ngIf="!post">
    <div class="not-found-content">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9.172 16.172a4 4 0 015.656 0M9 12h.01M15 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <h2>Post Not Found</h2>
      <p>The article you're looking for doesn't exist or has been removed.</p>
      <a routerLink="/newsroom" class="btn-primary">Return to Newsroom</a>
    </div>
  </div>
</div>
