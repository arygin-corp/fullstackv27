<!-- Fake backdrop (modal-like) -->
<div class="fake-backdrop" aria-hidden="true" (click)="toggle()"></div>

<!-- Overlay panel -->
<div class="interactive-ai-container" [class.exit]="state === 'exit'" (click)="$event.stopPropagation()"  role="presentation">
  <app-ai-brain2></app-ai-brain2>

  <div class="ai-status" [class.active]="isActive">
    <span class="status-indicator"></span>
    <span class="status-text">
      AI Engine is {{ currentStatus }}
    </span>
  </div>
</div>
