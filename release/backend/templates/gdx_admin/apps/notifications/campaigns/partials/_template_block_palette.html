<section class="card designer-panel">
	<div class="card-header">
		<div class="d-flex justify-content-between">
			<div>
				<h3 class="h6 mb-1">Content blocks</h3>
				<p class="small text-muted mb-0">Click or drag into the canvas.</p>
			</div>
			<span class="badge badge-soft-primary">6</span>
		</div>
	</div>
	<div class="card-body p-3">
		<div id="builderBlocks" class="designer-block-list">
			<button type="button" class="designer-block-row" draggable="true" data-block="heading">
				<span class="designer-block-icon bg-primary-transparent text-primary">
					<i class="ti ti-h-1"></i>
				</span>
				<span class="flex-grow-1">
					<strong>Heading</strong>
					<small>Section title</small>
				</span>
				<i class="ti ti-grip-vertical text-muted"></i>
			</button>
			<button type="button" class="designer-block-row" draggable="true" data-block="text">
				<span class="designer-block-icon bg-info-transparent text-info">
					<i class="ti ti-align-left"></i>
				</span>
				<span class="flex-grow-1">
					<strong>Text</strong>
					<small>Body copy</small>
				</span>
				<i class="ti ti-grip-vertical text-muted"></i>
			</button>
			<button type="button" class="designer-block-row" draggable="true" data-block="image">
				<span class="designer-block-icon bg-warning-transparent text-warning">
					<i class="ti ti-photo"></i>
				</span>
				<span class="flex-grow-1">
					<strong>Image</strong>
					<small>Responsive media</small>
				</span>
				<i class="ti ti-grip-vertical text-muted"></i>
			</button>
			<button type="button" class="designer-block-row" draggable="true" data-block="button">
				<span class="designer-block-icon bg-success-transparent text-success">
					<i class="ti ti-hand-click"></i>
				</span>
				<span class="flex-grow-1">
					<strong>Button</strong>
					<small>Call to action</small>
				</span>
				<i class="ti ti-grip-vertical text-muted"></i>
			</button>
			<button type="button" class="designer-block-row" draggable="true" data-block="divider">
				<span class="designer-block-icon bg-secondary-transparent text-secondary">
					<i class="ti ti-separator-horizontal"></i>
				</span>
				<span class="flex-grow-1">
					<strong>Divider</strong>
					<small>Visual separator</small>
				</span>
				<i class="ti ti-grip-vertical text-muted"></i>
			</button>
			<button type="button" class="designer-block-row" draggable="true" data-block="variables">
				<span class="designer-block-icon bg-purple-transparent text-purple">
					<i class="ti ti-braces"></i>
				</span>
				<span class="flex-grow-1">
					<strong>Variable</strong>
					<small>Personalized value</small>
				</span>
				<i class="ti ti-grip-vertical text-muted"></i>
			</button>
		</div>
	</div>
</section>
