<div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2"><p class="text-muted mb-0">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</p><nav aria-label="Order pagination"><ul class="pagination pagination-sm mb-0">{% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status|urlencode }}{% endif %}">Previous</a></li>{% endif %}{% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status|urlencode }}{% endif %}">Next</a></li>{% endif %}</ul></nav></div>
