{% with value=status|default:'unknown'|lower %} 
<span class="badge rounded-pill 
    {% if value == 'failed' or value == 'error' %}bg-danger-transparent text-danger
    {% elif value == 'completed' or value == 'success' or value == 'synced' %}bg-success-transparent text-success
    {% elif value == 'pending' or value == 'processing' %}bg-warning-transparent text-warning
    {% else %}bg-info-transparent text-info
    {% endif %}">
    {{ status|default:'Unknown'|title }}
</span>
{% endwith %}
