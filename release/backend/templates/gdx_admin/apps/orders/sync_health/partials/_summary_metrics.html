<div class="row g-3 mb-4">{% for label,value,icon,color in health_metric_cards %}{% endfor %}<div class="col-xl-3 col-sm-6"><div class="card metric-card h-100"><div class="card-body"><span class="metric-icon bg-primary-transparent text-primary"><i class="ti ti-package"></i></span><p class="text-muted mb-1">Marketplace orders</p><h3 class="mb-0">{{ health_metrics.orders|default:0 }}</h3></div></div></div><div class="col-xl-3 col-sm-6"><div class="card metric-card h-100"><div class="card-body"><span class="metric-icon bg-info-transparent text-info"><i class="ti ti-file-description"></i></span><p class="text-muted mb-1">Requests</p><h3 class="mb-0">{{ health_metrics.requests|default:0 }}</h3></div></div></div><div class="col-xl-3 col-sm-6"><div class="card metric-card h-100"><div class="card-body"><span class="metric-icon bg-success-transparent text-success"><i class="ti ti-list-check"></i></span><p class="text-muted mb-1">Tasks</p><h3 class="mb-0">{{ health_metrics.tasks|default:0 }}</h3></div></div></div><div class="col-xl-3 col-sm-6"><div class="card metric-card h-100"><div class="card-body"><span class="metric-icon bg-danger-transparent text-danger"><i class="ti ti-alert-triangle"></i></span><p class="text-muted mb-1">Failed tasks</p><h3 class="mb-0">{{ health_metrics.failed_tasks|default:0 }}</h3></div></div></div></div>
