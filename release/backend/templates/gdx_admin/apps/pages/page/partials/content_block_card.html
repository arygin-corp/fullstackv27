<div class="card mb-3" data-block-id="{{ block.pk }}">
  <div class="card-header d-flex justify-content-between align-items-center">
    <div><strong>{{ block.get_block_type_display }}</strong>{% if block.label %} · {{ block.label }}{% endif %}</div>
    <span class="badge bg-light text-dark">Position {{ block.position }}</span>
  </div>
  <div class="card-body">{% load page_blocks %}{% render_content_block block %}</div>
  {% if version.status == "draft" %}<div class="card-footer text-end"><a class="btn btn-sm btn-outline-primary" href="{% url 'pages_admin:block-edit' page.slug version.number block.pk %}">Edit</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'pages_admin:block-delete' page.slug version.number block.pk %}">Delete</a></div>{% endif %}
</div>
