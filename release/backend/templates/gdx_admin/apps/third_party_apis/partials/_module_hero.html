<section class="module-hero"{% if hero_id %} id="{{ hero_id }}"{% endif %}><div class="module-hero__content"><span class="module-hero__kicker" data-hero="kicker">{{ hero_kicker }}</span><div class="module-hero__title-row"><span class="module-hero__icon" data-hero="icon" aria-hidden="true">{{ hero_icon|default:"◇" }}</span><div><h1 data-hero="title">{{ hero_title }}</h1><p data-hero="description">{{ hero_description }}</p></div></div></div><div class="module-hero__metric"><span data-hero="metric-label">{{ hero_metric_label }}</span><strong data-hero="metric-value">{{ hero_metric_value|default:"0" }}</strong><small data-hero="metric-caption">{{ hero_metric_caption }}</small></div></section>
