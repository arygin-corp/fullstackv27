<header class="module-context-header">
  <div class="module-context-header__copy">
    <nav class="module-context-breadcrumb" aria-label="Breadcrumb">
      <a href="{% url 'third_party_api_ops:dashboard' %}">Modules</a>
      {% if breadcrumb_parent %}<span aria-hidden="true">»</span><span>{{ breadcrumb_parent }}</span>{% endif %}
      <span aria-hidden="true">»</span><span aria-current="page">{{ breadcrumb_current }}</span>
    </nav>
    <h1>{{ page_title }}</h1>
    <p>{{ page_description }}</p>
  </div>
  {% if page_actions %}<div class="module-context-header__actions">{{ page_actions }}</div>{% endif %}
</header>
