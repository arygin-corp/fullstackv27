{% extends "gdx_users/partials/base.html" %}
{% block extra_css %}{% include "gdx_users/apps/marketplace/partials/record_view_style.html" %}{% endblock %}
{% block contents %}
<div class="record-view">
    <div class="card">
        <div class="card-body">
            <div class="record-kicker">{{ collection.title }}</div>
            <h3 class="mb-2">Delete {{ object }}</h3>
            <p class="record-copy">This removes the record from the page.</p>
            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Delete</button>
                <a class="btn btn-light" href="{% url 'pages_staff:site-manage' collection.key %}">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
