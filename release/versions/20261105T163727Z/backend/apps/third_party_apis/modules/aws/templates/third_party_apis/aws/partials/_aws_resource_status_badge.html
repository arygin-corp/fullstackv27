{% if resource.enabled %}
<span class="badge bg-success-subtle text-success"><i class="ti ti-circle-check me-1"></i>Enabled</span>
{% elif resource.get_lifecycle_status_display %}
<span class="badge bg-secondary-subtle text-secondary"><i class="ti ti-circle-minus me-1"></i>{{ resource.get_lifecycle_status_display }}</span>
{% else %}
<span class="badge bg-danger-subtle text-danger"><i class="ti ti-circle-minus me-1"></i>Disabled</span>
{% endif %}
