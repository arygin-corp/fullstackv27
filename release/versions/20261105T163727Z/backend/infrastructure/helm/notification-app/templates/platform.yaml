{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: notification-app}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: notification-app-config}
data:
  KUBERNETES_DEPLOYMENT_ENABLED: "true"
  CHAOS_ENGINEERING_ENABLED: "{{ .Values.chaos.enabled }}"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: notification-app-web}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: notification-app, component: web}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: notification-app-default-deny-ingress}
spec:
  podSelector: {matchLabels: {app: notification-app}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{protocol: TCP, port: 8000}]
{{- if .Values.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: notification-app-web}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: notification-app-web}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}}
{{- end }}
{{- end }}
