<span class="badge 
    {% if post.status == 'PUBLISHED' %}bg-success-subtle text-success
    {% elif post.status == 'APPROVED' %}bg-primary-subtle text-primary
    {% elif post.status == 'REVIEW' %}bg-warning-subtle text-warning
    {% elif post.status == 'ARCHIVED' %}bg-dark-subtle text-dark
    {% else %}bg-secondary-subtle text-secondary{% endif %}">{% if post.status == 'PUBLISHED' %} 
    <i class="ti ti-world me-1"></i>{% elif post.status == 'APPROVED' %} 
    <i class="ti ti-check me-1"></i>{% elif post.status == 'REVIEW' %} 
    <i class="ti ti-eye-check me-1"></i>{% elif post.status == 'ARCHIVED' %} 
    <i class="ti ti-archive me-1"></i>
    {% else %} <i class="ti ti-pencil me-1"></i>
    {% endif %}
    {{ post.get_status_display }}
</span>
