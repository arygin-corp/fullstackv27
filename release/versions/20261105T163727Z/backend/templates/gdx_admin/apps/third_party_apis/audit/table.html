<table class="integration-table"><thead><tr><th>Time</th><th>Module</th><th>Action</th><th>Result</th><th>Message</th></tr></thead><tbody>{% for log in audit_rows %}<tr><td>{{ log.created_at }}</td><td>{{ log.module.name }}</td><td>{{ log.action }}</td><td>{{ log.result }}</td><td>{{ log.message }}</td></tr>{% empty %}<tr><td colspan="5">No audit events.</td></tr>{% endfor %}</tbody></table>
