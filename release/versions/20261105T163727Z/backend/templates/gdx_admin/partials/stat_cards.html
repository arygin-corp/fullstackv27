{% load static %} 


<div class="row g-4 mb-4">

    {% if stats %}
    <div class="col-xl-6">
        <div class="card bg-primary-gradient-200 border-0">
            <div class="card-body">
                <p class="text-white mb-1">{{ stats.0.label }}</p>
                <h2 class="text-white mb-3">{{ stats.0.value }}</h2>
                <div class="d-flex align-items-center">
                    <span class="badge bg-white bg-opacity-10 text-white">DAR Operations</span>
                </div>
            </div>
        </div>
    </div>
    {% endif %}

    <div class="col-xl-6">
        <div class="row g-3">
            {% for stat in stats|slice:"1:" %}

            <div class="col-md-4">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body">
                        <div class="text-muted small mb-2">{{ stat.label }}</div>
                        <h3 class="mb-0">{{ stat.value }}</h3>
                    </div>
                </div>
            </div>
            {% endfor %}

        </div>
    </div>
</div>
