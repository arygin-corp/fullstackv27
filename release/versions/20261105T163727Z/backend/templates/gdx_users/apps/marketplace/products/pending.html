{% extends 'gdx_users/partials/base.html' %}

{% block contents %}
<h1>Pending Products</h1>
<table class="table">
  <thead><tr><th>Title</th><th>Team</th><th>Created By</th><th>Actions</th></tr></thead>
  <tbody>
  {% for p in object_list %}
    <tr>
      <td><a href="{% url 'marketplace:detail' p.pk %}">{{ p.title }}</a></td>
      <td>{{ p.team.name }}</td>
      <td>{{ p.created_by.username }}</td>
      <td>
        <form method="post" action="{% url 'marketplace:approve' p.pk %}">{% csrf_token %}<button class="btn btn-sm btn-success">Approve</button></form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
