<!-- layout.component.html -->
<div class="block jumbotron jumbotron-fluid">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-lg-12 d-flex">
                <div class="account-nav flex-grow-1">
                    <nav class="navbar main-navbar navbar-expand-lg">
                        <div class="container-fluid">
                            <div class="navbar-brand">
                                <a routerLink="/newsroom">
                                    <img src="assets/images/badges/brands/marketplace-newsroom.svg" alt="Newsroom Logo"/>
                                </a>
                            </div>
                
                            <!-- layout.component.html -->
                            <ul class="navbar-nav">
                                <li *ngFor="let link of links" 
                                    class="nav-item" 
                                    [class.active]="selectedCategory === link.category">
                                    <a [routerLink]="link.category ? ['category', link.category] : ['/newsroom']">
                                    {{ link.label }}
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="col-12 col-lg-12 mt-4 mt-lg-0">
    <router-outlet></router-outlet>
</div>
