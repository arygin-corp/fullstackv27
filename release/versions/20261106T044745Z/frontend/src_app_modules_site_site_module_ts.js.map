<div class="jumbotron jumbotron-fluid">
    <div class="container">
        <h1 class="display-4 text-center" style="font-size: 28px; font-weight: 700;">Terms of Use</h1>
		<p class="lead text-center" style="font-size: 14px; font-weight: 300;">
			For authorized TMNA users only. By using this platform, you agree to follow TMNA data governance, privacy, and<br>
			security policies and use data solely for legitimate business purposes.</p>
    </div>
</div>

<div class="container" *ngIf="page">
  <ng-container *ngFor="let block of page.blocks">
    <div [innerHTML]="block.content"></div>
  </ng-container>
</div>
