<div class="jumbotron jumbotron-fluid">
    <div class="container">
        <h1 class="display-4 text-center" style="font-size: 28px; font-weight: 700;">FAQ</h1>
        <p class="lead text-center" style="font-size: 14px; font-weight: 300;">This is a Sample FAQ page.</p>
    </div>
</div>

<div class="container-fluid">
    <div class="col-12">
        <div class="col-6" style="float: left; padding-right: 12px">
            <h5>Testing 1</h5>
            <div *ngFor="let item of data;let i = index;">
                <button class="accordion" (click)="toggleAccordian($event, i)"> {{item.parentName}} </button>
                <div class="panel" hide="!item.isActive">
                    <p *ngFor="let child of item.childProperties" style="margin-top: 12px;"> {{child.propertyName}} </p>
                </div>
            </div>
        </div>
        <div class="col-6" style="float: left; padding-left: 12px">
            <h5>Testing 2</h5>
            <div *ngFor="let item of data;let i = index;">
                <button class="accordion" (click)="toggleAccordian($event, i)"> {{item.parentName}} </button>
                <div class="panel" hide="!item.isActive">
                    <p *ngFor="let child of item.childProperties" style="margin-top: 12px;"> {{child.propertyName}} </p>
                </div>
            </div>
        </div>
    </div>
</div>
