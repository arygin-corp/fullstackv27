<app-page-header [breadcrumbs]="breadcrumbs"></app-page-header>

<ng-container *ngIf="columns === 3">
    <div class="container-fluid">
        <div class="shop-layout shop-layout--sidebar--{{ sidebarPosition }}">
            <div class="shop-layout__sidebar" *ngIf="sidebarPosition === 'start'">
                <app-shop-sidebar [offcanvas]="offcanvasMode"></app-shop-sidebar>
            </div>
            <div class="shop-layout__content">
                <div class="block">
                    <app-products-view
                        [layout]="viewMode"
                        grid="grid-3-sidebar"
                        [offcanvas]="offcanvasMode"
                        (gridChange)="onGridChange($event)">
                    </app-products-view>
                </div>
            </div>
            <div class="shop-layout__sidebar" *ngIf="sidebarPosition === 'end'">
                <app-shop-sidebar [offcanvas]="offcanvasMode"></app-shop-sidebar>
            </div>
        </div>
    </div>
</ng-container>

<ng-container *ngIf="columns > 3">
    <div class="container">
        <div class="block">
            <app-products-view
                [layout]="viewMode"
                [grid]="getProductsViewLayout()"
                [offcanvas]="offcanvasMode"
                (gridChange)="onGridChange($event)">
            </app-products-view>
        </div>
        <app-shop-sidebar [offcanvas]="offcanvasMode"></app-shop-sidebar>
    </div>
</ng-container>
