<div class="card h-100"><div class="card-header"><h3 class="h5 mb-0"><i class="ti ti-link me-2 text-warning"></i>Dependencies</h3></div><div class="card-body"><ul class="list-group list-group-flush">{% for dep in resource.outgoing_dependencies.all %}<li class="list-group-item px-0">{{ dep.dependency_type }} → {{ dep.target.name }}: {{ dep.description }}</li>{% empty %}<li class="list-group-item px-0 text-muted">No dependencies.</li>{% endfor %}</ul></div></div>
