{% extends 'apify_admin/base.html' %}{% block title %}Copy Secret | Apify Admin{% endblock %}{% block content %}<div class="card border-warning"><div class="card-body"><h2>Copy this secret now</h2><p>It will not be displayed again.</p><div class="input-group"><input id="one-time-secret" class="form-control font-monospace" value="{{ one_time_secret }}" readonly><button class="btn btn-outline-primary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('one-time-secret').value)">Copy</button></div><a class="btn btn-primary mt-16" href="{% url 'apify_admin:credential-detail' credential.pk %}">Done</a></div></div>{% endblock %}
