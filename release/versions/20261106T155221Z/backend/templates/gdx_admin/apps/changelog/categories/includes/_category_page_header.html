<div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
  <div>
    <nav aria-label="breadcrumb"><ol class="breadcrumb breadcrumb-arrow mb-2">
      <li class="breadcrumb-item"><a href="{% url 'changelog:dashboard' %}">Changelog</a></li>
      <li class="breadcrumb-item"><a href="{% url 'changelog:category-list' %}">Categories</a></li>
      {% if breadcrumb_current %}<li class="breadcrumb-item active" aria-current="page">{{ breadcrumb_current }}</li>{% endif %}
    </ol></nav>
    <h2 class="h4 mb-1">{{ page_heading }}</h2>
    {% if page_description %}<p class="text-muted mb-0">{{ page_description }}</p>{% endif %}
  </div>
  <div class="d-flex flex-wrap gap-2">{{ page_actions }}</div>
</div>
