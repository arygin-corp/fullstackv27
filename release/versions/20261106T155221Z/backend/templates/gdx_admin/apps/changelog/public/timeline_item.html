<article class="item" data-release-id="{{ post.pk }}" data-version="{{ post.version }}">
  <div class="timeline{% if has_next %} has-next{% endif %}">
    <div>
      <div class="meta">
        <div class="version">Version {{ post.version }}</div>
        <time class="release-date" datetime="{{ post.release_date|date:'c' }}">{{ post.release_date|date:"m/d/Y" }}</time>
      </div>
      <div class="connector" aria-hidden="true"><div></div></div>
    </div>
  </div>
  <div class="content">
    <h3>Yahoo!🎉 - {{ post.title }}</h3>
    <p>{{ post.desc }}</p>
    {% for section in sections %}
      <section class="release-section" data-section="{{ section.key }}">
        <div class="feature feature-padding{% if forloop.first %} first-feature{% endif %}">
          <div class="tag {{ section.tag_class }}">{{ section.category }}</div>
          {% if section.subtitle %}<h5>{{ section.subtitle }}</h5>{% endif %}
        </div>
        <div class="section-content">{{ section.html|safe }}</div>
      </section>
    {% endfor %}
  </div>
</article>
