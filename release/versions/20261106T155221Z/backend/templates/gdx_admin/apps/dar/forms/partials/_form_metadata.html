<div class="card h-100">
  <div class="card-header"><h3 class="h5 mb-0"><i class="ti ti-list-details me-2 text-primary"></i>Form properties</h3></div>
  <div class="card-body">
    <div class="row g-2 py-3 border-bottom"><div class="col-sm-4 text-muted">Name</div><div class="col-sm-8 fw-semibold text-break">{{ form.name }}</div></div>
    <div class="row g-2 py-3 border-bottom"><div class="col-sm-4 text-muted">Slug</div><div class="col-sm-8"><code class="text-break">{{ form.slug }}</code></div></div>
    <div class="row g-2 py-3 border-bottom"><div class="col-sm-4 text-muted">Version</div><div class="col-sm-8">{{ form.version }}</div></div>
    <div class="row g-2 pt-3"><div class="col-sm-4 text-muted">State</div><div class="col-sm-8">{% include "gdx_admin/apps/dar/forms/partials/_form_state_badge.html" with form=form %}</div></div>
  </div>
</div>
