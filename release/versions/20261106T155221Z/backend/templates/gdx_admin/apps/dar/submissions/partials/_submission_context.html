<div class="card mt-4"><div class="card-header"><div><h3 class="h5 mb-1"><i class="ti ti-route me-2 text-info"></i>Submission context and routing</h3><p class="text-muted mb-0">Context or routing output recorded with the request.</p></div></div><div class="card-body">{% if submission.context %}<pre class="bg-light border rounded-3 p-3 mb-0 overflow-auto text-wrap">{{ submission.context|pprint }}</pre>{% else %}<div class="text-center py-4"><span class="avatar bg-info-subtle text-info rounded-circle"><i class="ti ti-route-off"></i></span><p class="text-muted mb-0 mt-2">No context or routing result was recorded.</p></div>{% endif %}</div></div>
