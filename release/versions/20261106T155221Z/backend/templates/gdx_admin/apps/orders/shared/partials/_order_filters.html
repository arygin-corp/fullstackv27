<div class="card-body border-bottom"><form method="get" class="row g-2 align-items-end"><div class="col-lg-5"><label class="form-label">Search</label><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="Order, REQ, RITM, product"></div><div class="col-lg-4"><label class="form-label">Status</label><select class="form-select" name="status"><option value="">All</option>{% for value in sync_statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ value|title }}</option>{% endfor %}</select></div><div class="col-lg-3 d-flex gap-2"><button class="btn btn-primary flex-fill">Filter</button><a class="btn btn-outline-secondary" href="{% url 'orders-admin:order-list' %}">Reset</a></div></form></div>
