<form class="row g-2 mb-3" method="get"><div class="col-md-6"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="Search"></div><div class="col-md-3"><select class="form-select" name="status"><option value="">All statuses</option>{% for value,label in status_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div><div class="col-md-3"><button class="btn btn-outline-primary w-100">Filter</button></div></form>
