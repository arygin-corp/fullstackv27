<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{{ status_chart|json_script:"status-chart-data" }}
{{ submissions_by_day|json_script:"submission-data" }}
{{ aging_buckets|json_script:"aging-data" }}
<script>
document.addEventListener("DOMContentLoaded", function () {
    const statusElement = document.getElementById("status-chart-data");
    const statusCanvas = document.getElementById("statusChart");
    if (statusElement && statusCanvas) {
        const statusData = JSON.parse(statusElement.textContent);
        new Chart(statusCanvas, {
            type: "doughnut",
            data: {
                labels: statusData.map(item => item.status),
                datasets: [{
                    data: statusData.map(item => item.total),
                    backgroundColor: ["#0d6efd", "#198754", "#ffc107", "#dc3545", "#6c757d"]
                }]
            },
            options: { maintainAspectRatio: false }
        });
    }

    const trendElement = document.getElementById("submission-data");
    const trendCanvas = document.getElementById("submissionTrendChart");
    if (trendElement && trendCanvas) {
        const trendData = JSON.parse(trendElement.textContent);
        new Chart(trendCanvas, {
            type: "line",
            data: {
                labels: trendData.map(item => item.day),
                datasets: [{
                    label: "Submissions",
                    data: trendData.map(item => item.total),
                    borderColor: "#0d6efd",
                    backgroundColor: "rgba(13,110,253,.15)",
                    fill: true,
                    tension: 0.4,
                    borderWidth: 3
                }]
            },
            options: { maintainAspectRatio: false }
        });
    }

    const agingElement = document.getElementById("aging-data");
    const agingCanvas = document.getElementById("agingChart");
    if (agingElement && agingCanvas) {
        const agingData = JSON.parse(agingElement.textContent);
        new Chart(agingCanvas, {
            type: "bar",
            data: {
                labels: Object.keys(agingData),
                datasets: [{
                    label: "Open requests",
                    data: Object.values(agingData),
                    backgroundColor: "rgba(255,193,7,.55)",
                    borderColor: "#d39e00",
                    borderWidth: 1
                }]
            },
            options: {
                maintainAspectRatio: false,
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
            }
        });
    }
});
</script>
