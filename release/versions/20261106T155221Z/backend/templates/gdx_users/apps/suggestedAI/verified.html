<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>AI Suggested Search</title>
        <link rel="stylesheet" href="/static/css/bootstrap.min.css">
        <link rel="stylesheet" href="/static/css/app.css">
        <link rel="stylesheet" href="/static/css/suggestedAI/suggestedAI.css">
        <style>
            .card {
                box-shadow: 0 6px 6px rgba(0, 0, 0, 0.3);
                transition: 200ms;
                background: #fff;
            }
            .card .card__toptitle {
                display: flex;
                align-items: center;
                padding: 12px 40px;
            }
            .card .card__toptitle h3 {
                flex: 0 1 250px;
                text-align: right;
                margin: 0;
                color: #252525;
                font-family: sans-serif;
                font-weight: 600;
                font-size: 20px;
                text-transform: uppercase;
            }
            .card .card__toptitle .icon {
                flex: 1 0 10px;
                background: #7252D3;
                color: #fff;
                padding: 10px 10px;
                transition: 200ms;
            }
            .card .card__producttitle {
                display: flex;
                align-items: center;
                padding: 8px 40px;
                font-weight: bold;
            }
            .card .card__producttitle h1 {
                margin: 0;
                padding: 0;
                font-weight: 800;
                font-family: "Montserrat", sans-serif;
                font-size: 24px;
                line-height: 0px;
                color: #181e28;
            }
            .card .card__body p.sub {
                font-family: "Montserrat", sans-serif;
                font-size: 26px;
                text-transform: uppercase;
                color: #686e77;
                font-weight: 600;
                margin-bottom: 5px;
            }
            .card .card__title {
                display: flex;
                align-items: center;
                padding: 0px 40px;
            }
            .card .card__title .icon > a {
                color: #fff;
            }
            .card .card__title .icon:hover {
                background: #252525;
            }
            .card .card__body {
                padding: 0 40px;
                display: flex;
                flex-flow: row no-wrap;
                margin-bottom: 25px;
            }
            .card .card__body > .half {
                box-sizing: border-box;
                padding: 0 15px;
                flex: 1 0 50%;
            }
            .card .card__body .featured_text h1 {
                margin: 0;
                padding: 0;
                font-weight: 800;
                font-family: "Montserrat", sans-serif;
                font-size: 64px;
                line-height: 50px;
                color: #181e28;
            }
            .card .card__body .featured_text p {
                margin: 0;
                padding: 0;
            }
            .card .card__body .featured_text p.sub {
                font-family: "Montserrat", sans-serif;
                font-size: 26px;
                text-transform: uppercase;
                color: #686e77;
                font-weight: 300;
                margin-bottom: 5px;
            }
            .card .card__body .featured_text p.price {
                font-family: "Fjalla One", sans-serif;
                color: #252525;
                font-size: 26px;
            }
            .card .card__body .image {
                padding-top: 15px;
                width: 100%;
            }
            .card .card__body .image img {
                display: block;
                max-width: 100%;
                height: auto;
            }
            .card .card__body .description {
                
            }
            .card .card__body .description p {
                margin: 0;
                font-family: "Open Sans", sans-serif;
                font-weight: 300;
                line-height: 27px;
                font-size: 16px;
                color: #555;
            }
            .card .card__body span.stock {
                font-family: "Montserrat", sans-serif;
                font-weight: 600;
                color: #a1cc16;
            }
            .card .card__body .reviews .stars {
                display: inline-block;
                list-style: none;
                padding: 0;
            }
            .card .card__body .reviews .stars > li {
                display: inline-block;
            }
            .card .card__body .reviews .stars > li .fa {
                color: #f7c01b;
            }
            .card .card__body .reviews > span {
                font-family: "Open Sans", sans-serif;
                font-size: 14px;
                margin-left: 5px;
                color: #555;
            }
            .card .card__footer {
                padding: 30px 40px;
                display: flex;
                flex-flow: row no-wrap;
                align-items: center;
                position: relative;
            }
            .card .card__footer::before {
                content: "";
                position: absolute;
                display: block;
                top: 0;
                left: 40px;
                width: calc(100% - 40px);
                height: 3px;
                background: #7252D3;
                background: linear-gradient(to right, #7252D3 0%, #7252D3 20%, #ddd 20%, #ddd 100%);
            }
            .card .card__footer .recommend {
                flex: 1 0 10px;
            }
            .card .card__footer .recommend p {
                margin: 0;
                font-family: "Montserrat", sans-serif;
                text-transform: uppercase;
                font-weight: 600;
                font-size: 14px;
                color: #555;
            }
            .card .card__footer .recommend h3 {
                margin: 0;
                font-size: 20px;
                font-family: "Montserrat", sans-serif;
                font-weight: 600;
                text-transform: uppercase;
                color: #7252D3;
            }
            .card .card__footer .action button {
                cursor: pointer;
                border: 1px solid #7252D3;
                padding: 14px 30px;
                border-radius: 200px;
                color: #fff;
                background: #7252D3;
                font-family: "Open Sans", sans-serif;
                font-size: 16px;
                transition: 200ms;
            }
            .card .card__footer .action button:hover {
                background: #fff;
                color: #7252D3;
            }

            .overlay-image {
                position: absolute;
                top: 20px;  /* Adjust as needed */
                left: 20px; /* Adjust as needed */
                width: 100px; /* Resize overlay */
                opacity: 0.8; /* Optional transparency */
            }
            .custom-badge-icon {
                width: 100%;
                max-width: 200px;
                margin-right: 40px;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="container">
                <div class="card">
                    <div class="card__toptitle">
                        <div class="icon">
                            <a href="#"><i class="fa fa-arrow-left"></i></a>
                        </div>
                        <h3>Suggested Product</h3>
                    </div>
                    <div class="card__producttitle">
                        <img class="custom-badge-icon" src="http://localhost:8000/marketplace/media/marketplace/badges/dm-ai-verified.svg">
                        <span style="position: relative; bottom: -13px;"><h1>This is Where the Product Name Is Going</h1><br>
                            <h6>
                                <strong>Datatype: </strong>Datatset&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                                <span><strong>Classification: </strong> Confidential</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                                <span><strong>PI: </strong> Yes</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                                <span><strong>SPI: </strong> Yes</span>
                            </h6>
                        </span>
                    </div>
                    <div class="card__body">
                        <div class="half">
                            <div class="image">
                                <img src="http://localhost:8000/marketplace/media/marketplace/products/garage_details_evehicle.jpg" alt="">
                            </div>
                        </div>
                        <div class="half">
                            {% comment %} <img class="custom-badge-icon" src="http://localhost:8000/marketplace/media/marketplace/badges/dm-ai-verified.svg"> {% endcomment %}
                            <div class="description mt-2">
                                <h4 class="text-center mt-2"><strong>Verification Score & Summary</strong></h4>
                            </div>
                            <span class="stock"><i class="fa fa-pen"></i>A</span>
                        </div>
                    </div>
                    <div class="card__footer">
                        <div class="recommend">
                            <p>Recommended by</p>
                            <h3 class="text-primary">Data Marketplace AI</h3>
                        </div>
                        <div class="">
                            <button type="button" class="btn btn-md btn-primary">View Product</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
