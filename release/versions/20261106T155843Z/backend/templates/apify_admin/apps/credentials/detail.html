{% extends 'apify_admin/base.html' %}{% block content %}<h1>Credential {{ credential.client_id }}</h1>{% if one_time_secret %}<div><strong>Copy now:</strong><code>{{ one_time_secret }}</code></div>{% endif %}<p>Status: {{ credential.get_status_display }}</p><form method="post" action="{% url 'apify_admin:credential-rotate' credential.pk %}">{% csrf_token %}<button>Rotate</button></form><form method="post" action="{% url 'apify_admin:credential-revoke' credential.pk %}">{% csrf_token %}<input name="reason" required><button>Revoke</button></form>{% endblock %}
