<div class="card h-100"><div class="card-header"><h3 class="h5 mb-0"><i class="ti ti-list-details me-2 text-primary"></i>Release properties</h3></div><div class="card-body"><div class="row g-2 py-3 border-bottom"><div class="col-sm-4 text-muted">Version</div><div class="col-sm-8"><code>{{ post.version }}</code></div></div><div class="row g-2 py-3 border-bottom"><div class="col-sm-4 text-muted">Status</div><div class="col-sm-8">{% include "gdx_admin/apps/changelog/posts/partials/_post_status_badge.html" with post=post %}</div></div><div class="row g-2 py-3 border-bottom"><div class="col-sm-4 text-muted">Release date</div><div class="col-sm-8 fw-medium">{{ post.release_date|date:"M d, Y H:i T" }}</div></div><div class="row g-2 pt-3"><div class="col-sm-4 text-muted">Scheduled publish</div><div class="col-sm-8 fw-medium">{{ post.publish_at|date:"M d, Y H:i T"|default:"Not scheduled" }}</div></div></div></div>
