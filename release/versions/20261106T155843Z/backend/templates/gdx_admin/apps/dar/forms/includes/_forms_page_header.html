<div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
  <div>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb breadcrumb-arrow mb-2">
        <li class="breadcrumb-item">DAR</li>
        <li class="breadcrumb-item"><a href="{% url 'dar-admin:form-list' %}">Forms</a></li>
        {% if current_label %}<li class="breadcrumb-item active" aria-current="page">{{ current_label }}</li>{% endif %}
      </ol>
    </nav>
    <h2 class="h4 mb-1">{{ page_heading }}</h2>
    <p class="text-muted mb-0">{{ page_description }}</p>
  </div>
  <div class="d-flex flex-wrap gap-2">{% block forms_page_actions %}{% endblock %}</div>
</div>
