<div class="flex-fill bg-transparent pb-3 d-block position-relative z-1 mb-4">
  <div class="card bg-primary-gradient-200 mb-0 overflow-hidden">
    <div class="card-body p-4 p-lg-5">
      <div class="row align-items-center g-4">
        <div class="col-lg-8">
          <span class="badge rounded-pill text-white bg-white bg-opacity-10 mb-3">
            <i class="ti ti-database-search me-1"></i>{{ hero_badge|default:"DAR LOOKUP DATA" }}
          </span>
          <div class="d-flex align-items-center gap-3">
            <span class="avatar avatar-xl rounded-circle bg-white bg-opacity-10 text-white flex-shrink-0">
              <i class="{{ hero_icon|default:'ti ti-list-search' }} fs-2"></i>
            </span>
            <div class="min-w-0">
              <h1 class="text-white mb-2 text-break">{{ hero_title }}</h1>
              <p class="text-white opacity-75 mb-0">{{ hero_description }}</p>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="text-lg-end">
            <p class="text-white mb-1">{{ hero_metric_label|default:"Lookup records" }}</p>
            <h2 class="display-5 text-white fw-bold mb-0">{{ hero_metric|default:"0" }}</h2>
            {% if hero_metric_help %}<small class="text-white opacity-75">{{ hero_metric_help }}</small>{% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="position-absolute bottom-0 w-100 z-n1">
    <div class="p-3 mx-3 bg-primary-500 rounded-3 bg-opacity-20"></div>
    <div class="p-2 mx-4 bg-primary-600 rounded-3 bg-opacity-20"></div>
  </div>
</div>
