<header class="workflow-toolbar"><input class="workflow-search" data-node-search type="search" placeholder="Search" aria-label="Search workflow nodes"><span class="workflow-spacer"></span><a class="wf-btn" href="{% url 'dar-admin:form-detail' form.pk %}">Close</a></header><div class="workflow-titlebar"><h1>{{ form.name }} workflow</h1><span class="workflow-badge" data-workflow-badge>{% if workflow.is_published %}Published{% else %}Draft{% endif %}</span><span class="workflow-spacer"></span><button class="wf-btn" type="button" data-save-workflow>Save draft</button><button class="wf-btn wf-btn--primary" type="button" data-publish-workflow>Publish</button><button class="wf-btn wf-btn--icon" type="button" data-add-node aria-label="Add action">+</button></div>
