{% if steps %}
<ol class="deploy-timeline" aria-label="Build timeline">
    {% for step in steps %}
    <li class="is-{{ step.state }}">
        <span class="deploy-timeline__dot" aria-hidden="true"></span>
        <strong>{{ step.title }}</strong>
        {% if step.detail %}<small>{{ step.detail }}</small>{% endif %}
    </li>
    {% endfor %}
</ol>
{% endif %}
