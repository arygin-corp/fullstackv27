<section class="card shadow-sm mb-4" aria-labelledby="tracking-search-title">
	<div class="card-body p-3 p-md-4">
		<div class="mb-3">
			<h3 class="h5 mb-1" id="tracking-search-title">Find an order</h3>
			<p class="text-muted mb-0">Enter one complete identifier. Spaces before or after the value are ignored.</p>
		</div>
		<form method="get" role="search" aria-describedby="track-help">
			<div class="row g-3 align-items-end">
				<div class="col-12 col-lg-8">
					<label class="form-label fw-semibold" for="track-identifier">Order identifier <span class="text-danger" aria-hidden="true">*</span>
						<span class="visually-hidden">required</span>
					</label>
					<div class="input-group input-group-lg">
						<span class="input-group-text" aria-hidden="true">
							<i class="ti ti-search"></i>
						</span>
						<input 
                            id="track-identifier" 
                            class="form-control" 
                            name="identifier" 
                            value="{{ identifier }}" 
                            placeholder="GDX-ORD-10001, REQ000145, or RITM000145" 
                            autocomplete="off" 
                            spellcheck="false" 
                            required aria-required="true" a
                            ria-describedby="track-help" 
                            style="height: 40px; width: 100%; max-width: 530px;">
                        <button class="btn btn-primary btn-lg flex-fill" type="submit">
							<i class="ti ti-route me-1" aria-hidden="true"></i>Track order 
                        </button>
                        {% if identifier %} 
                        <a class="btn btn-outline-secondary btn-lg" href="{% url 'orders-admin:track-order' %}">Clear</a>
                        {% endif %}
					</div>
					<div class="form-text" id="track-help">Accepted formats: Marketplace Order ID, ServiceNow REQ number, or RITM number.</div>
				</div>
			</div>
		</form>
	</div>
</section>
