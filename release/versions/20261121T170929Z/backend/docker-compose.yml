# Single-instance Elastic Beanstalk runs this file with Docker Compose.
# The host publishes port 80, so the environment does not create a load balancer.
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-gdx.settings.dev}
  DJANGO_ENV: ${DJANGO_ENV:-dev}
  APP_ENV: ${APP_ENV:-dev}
  GDXP_SECRET_KEY: ${GDXP_SECRET_KEY:-}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-.elasticbeanstalk.com}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
  DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-false}
  DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-false}
  AWS_REGION: ${AWS_REGION:-us-west-2}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
  DB_HOST: ${DB_HOST:-}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-}
  DB_USER: ${DB_USER:-}
  DB_PASSWORD: ${DB_PASSWORD:-}
  DB_SSLMODE: ${DB_SSLMODE:-require}
  REDIS_URL: ${REDIS_URL:-}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-django-db}
  MONITORING_TOKEN: ${MONITORING_TOKEN:-}

services:
  migrate:
    build: .
    command: ["/app/scripts/migrate.sh"]
    environment:
      <<: *app-env
      COLLECT_STATIC: "false"
    restart: "no"

  web:
    build: .
    command: ["/app/scripts/web.sh"]
    ports:
      - "80:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      COLLECT_STATIC: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/live/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    build: .
    command: ["/app/scripts/worker.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      COLLECT_STATIC: "false"

  beat:
    build: .
    command: ["/app/scripts/beat.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      COLLECT_STATIC: "false"
